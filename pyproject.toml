[project]
name = "fleet-copilot"
version = "0.1.0"
description = "Agentic Fleet Copilot: grounded Q&A, trend detection and guarded action proposals over device telemetry."
requires-python = ">=3.12"
dependencies = [
  "langgraph>=0.6",
  "langgraph-checkpoint-sqlite>=2.0",
  "langchain-openai>=0.3",
  "langchain-core>=0.3",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "rich>=13.7",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
fleet-copilot = "fleet_copilot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
